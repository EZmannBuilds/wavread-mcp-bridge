name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't attach Live Sets or audio you don't have the rights to share. Never paste API keys or tokens."
  - type: input
    id: live
    attributes: {label: Ableton Live version, placeholder: "12.4.16 Suite"}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: "macOS 15.5"}
    validations: {required: true}
  - type: input
    id: client
    attributes: {label: MCP client, placeholder: "Claude Code 2.x"}
  - type: input
    id: version
    attributes: {label: Remote Script version (from tooling_info)}
  - type: textarea
    id: steps
    attributes: {label: What you ran, description: "The tool call(s) and arguments", render: text}
    validations: {required: true}
  - type: textarea
    id: got
    attributes: {label: What happened, description: "The tool's JSON reply, and anything in Live's Log.txt", render: text}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
